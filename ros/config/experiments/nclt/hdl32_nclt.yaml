# NCLT: shared settings for 2012-01-15, 2012-04-29 and 2012-05-11.
# Velodyne HDL-32E + Microstrain MS25, using original sensor-frame measurements.
# Topics below are defaults for a prepared bag; adapt them to your converter.
# extrinsic_r / extrinsic_t map LiDAR coordinates into the IMU frame:
# T_I_L = inverse(T_B_I) * T_B_L, from NCLT Table 4.
# https://robots.engin.umich.edu/nclt/nclt.pdf
# Do not apply this transform unchanged to body-frame or pre-deskewed clouds.
# Input preparation and evaluation conventions: ros/README.md#nclt-dataset

common:
    lidar_topic: /velodyne_points
    imu_topic: /imu/data
    time_offset: 0.0
    qos_reliability: reliable
    qos_depth: 1000

runtime:
    max_threads: 0

preprocess:
    lidar_type: velodyne
    scan_line: 32
    scan_rate: 10
    blind_min: 0.5
    blind_max: 100.0
    point_filter_num: 1

mapping:
    max_iteration: 4
    down_sample_size: 0.25
    voxel_size: 1.0
    max_layer: 4
    layer_point_size: [5, 5, 5, 5, 5]
    planar_threshold: 0.0005
    sigma_num: 3.0
    max_points_size: 100
    max_mature_points_size: 100
    map_range: 250.0
    extrinsic_est_en: false
    extrinsic_t: [0.112, 0.176, -0.247]
    extrinsic_r: [-0.012269305293715671, 0.9998250461596709, -0.014118825001462157,
                  -0.9999205319091498, -0.012308942481015828, -0.0027239312624388204,
                  -0.0028972425050461884, 0.014084282261136283, 0.9998966141452106]

adaptive_voxelization:
    enable: true
    window_size: 5
    scale_threshold: 30.0
    setpoint_exponent: 2
    min_points: 1000
    max_points: 4000
    error_sensitivity: 0.1
    error_rate_sensitivity: 0.2
    p_gain_min: 5.0e-06
    p_gain_max: 5.0e-05
    d_gain_min: 5.0e-08
    d_gain_max: 5.0e-07

hybrid_metric:
    enable: true
    lambda_po: 0.05
    sigma_num: 3.0
    max_points_per_voxel: 128
    reduction_ratio: 4
    adaptive_threshold:
        initial_threshold: 0.5
        max_range_motion: 100.0

noise_model:
    ranging_cov: 0.04
    angle_cov: 0.1
    acc_cov: 0.001
    gyr_cov: 0.005
    b_acc_cov: 0.0001
    b_gyr_cov: 1.0e-05

publish:
    terminal_status_en: false
    path_en: true
    scan_publish_en: true
    dense_publish_en: false
    scan_bodyframe_pub_en: false
    scan_semantic_publish_en: true
    voxel_map_en: false
    voxel_map_max_layer: 1

pcd_save:
    enable: false
    interval: -1
    directory: ''
